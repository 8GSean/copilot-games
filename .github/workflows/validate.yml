name: Validate Brick Arcade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Co-op server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Start local Worker
        run: |
          npx wrangler dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:8787/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://localhost:8787/ > /dev/null
      - run: npm test

  static:
    name: Static file checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check expected arcade files
        shell: bash
        run: |
          test -f index.html
          test -f games/brick-heroes/index.html
          test -f games/brick-heroes/manifest.webmanifest
          test -f games/brick-heroes/sw.js
          test -f .github/copilot-instructions.md
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check server/src/index.js
          node --check server/test-client.mjs
